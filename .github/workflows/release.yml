# ประกอบตัวติดตั้ง .exe บนเครื่องของ GitHub — ขั้นตอนออกรุ่นดู BUILD.md
name: Release

on:
  # push tag เช่น v1.0.2 = ออกรุ่น (ได้ draft release พร้อม .exe)
  push:
    tags:
      - 'v*'
  # กดรันเองในแท็บ Actions = ลอง build เฉยๆ ไม่สร้าง release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ต้องเป็น Windows — ตัวติดตั้งเป็น NSIS และเทสต์ใช้ better-sqlite3 ที่ build มาสำหรับ Electron
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ชื่อไฟล์ .exe ใช้เลขจาก package.json จึงต้องตรงกับ tag
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      # รันครบทุกชุดแม้ชุดแรกจะพัง แล้วสรุปข้อที่ไม่ผ่านขึ้นหน้า run (ไม่ต้องไล่อ่าน log)
      - name: Test
        shell: bash
        run: |
          failed=0
          printf '## ผลเทสต์\n\n| ชุด | ผล |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          : > reasons.txt

          for file in scripts/*-smoke.mjs; do
            suite=$(basename "$file" -smoke.mjs)
            echo "::group::$suite"
            node "$file" 2>&1 | tee out.txt
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "| $suite | ✅ ผ่าน |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            failed=1
            echo "| $suite | ❌ ไม่ผ่าน |" >> "$GITHUB_STEP_SUMMARY"

            # บรรทัด "  FAIL ชื่อข้อ" ตามด้วยบรรทัดเหตุผล (รูปแบบจาก scripts/lib/harness.mjs)
            awk '/^  FAIL /{name=substr($0,8); getline; sub(/^ +/,""); print name " — " $0}' out.txt > fails.txt
            # ไม่มีบรรทัด FAIL = สคริปต์ล้มกลางทาง เอาบรรทัด Error แรก (ไม่มีก็บรรทัดสุดท้าย) มาแทน
            if [ ! -s fails.txt ]; then
              reason=$(grep -m 1 -E '^[A-Za-z]*Error' out.txt || grep -v '^[[:space:]]*$' out.txt | tail -n 1)
              echo "เทสต์หยุดกลางคัน — $reason" > fails.txt
            fi

            while IFS= read -r line; do
              echo "::error title=$suite::$line"
              echo "- **$suite**: $line" >> reasons.txt
            done < fails.txt
          done

          if [ "$failed" -eq 1 ]; then
            printf '\n### ข้อที่ไม่ผ่าน\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat reasons.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f out.txt fails.txt reasons.txt
          exit "$failed"

      # --publish never: ห้าม electron-builder อัปโหลดเอง ขั้นล่างเป็นคนอัปโหลด
      - run: npm run dist -- --publish never

      - name: Upload installer as artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DormyManager-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

      # draft = คนนอกยังไม่เห็น ลองติดตั้งก่อนแล้วค่อยกด Publish
      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --generate-notes --draft
